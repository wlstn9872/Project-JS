<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>프로젝트 JS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF9F5">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#FAF9F5;
    --paper-dim:#F1EFE8;
    --ink:#242220;
    --ink-soft:#8A8579;
    --line:#E4E0D6;
    --sage:#6E7F5C;
    --sage-bg:#E7ECDE;
    --amber:#C1893F;
    --amber-bg:#F3E7D3;
    --brick:#AD5138;
    --brick-bg:#F2DFD8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    background:var(--paper-dim);
    font-family:-apple-system, "Roboto", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color:var(--ink);
  }
  .device{
    max-width:420px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  /* ===== 통계 버튼 (화면 슬라이드와 무관하게 항상 같은 자리에 고정) ===== */
  .stats-btn{
    position:absolute;
    top:18px;
    right:20px;
    width:28px; height:28px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    cursor:pointer;
    z-index:6;
  }
  .stats-btn:active{background:var(--paper-dim);}

  /* ===== 페이지 슬라이드 (날짜별 화면 전체가 여기 안에 들어감) ===== */
  .page-viewport{
    overflow-x:hidden;
    position:relative;
  }
  .page-slide{
    touch-action:pan-y;
  }

  /* ===== 상태표시줄 (날짜 / 몸무게·자산) ===== */
  .statusbar{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    user-select:none;
  }
  .statusbar-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-right:38px; /* 오른쪽 위 고정된 통계 버튼과 안 겹치게 */
  }
  .date-block{display:flex; flex-direction:column; gap:2px;}
  .date-main{font-size:15px; font-weight:600; letter-spacing:-.2px;}
  .date-sub{font-size:11px; color:var(--ink-soft);}
  .stat-block{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .stat-value{
    font-size:15px;
    font-weight:600;
    padding:1px 4px;
    margin:-1px -4px;
    border-radius:5px;
    cursor:pointer;
  }
  .stat-value:active{background:var(--paper-dim);}
  .swipe-hint{
    display:flex; justify-content:center; gap:4px; margin-top:10px;
  }
  .dot{width:4px; height:4px; border-radius:50%; background:var(--line);}
  .dot.active{background:var(--ink-soft);}

  /* ===== 통계 오버레이 ===== */
  .stats-overlay{
    position:absolute;
    inset:0;
    background:var(--paper);
    transform:translateX(100%);
    transition:transform .22s ease;
    z-index:10;
    display:flex;
    flex-direction:column;
  }
  .stats-overlay.open{ transform:translateX(0); }
  .stats-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .stats-back{
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    cursor:pointer;
    border-radius:8px;
  }
  .stats-back:active{background:var(--paper-dim);}
  .stats-title{font-size:14px; font-weight:600;}

  .stats-tabs{
    display:flex;
    gap:6px;
    padding:12px 16px 0;
  }
  .stats-tab{
    flex:1;
    text-align:center;
    font-size:12px;
    padding:7px 0;
    border-radius:8px;
    background:var(--paper-dim);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .stats-tab.active{
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
  }

  .stats-legend{
    display:flex;
    gap:16px;
    padding:14px 16px 0;
    font-size:11px;
    color:var(--ink-soft);
  }
  .legend-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    margin-right:5px;
  }
  .legend-dot.weight{ background:var(--sage); }
  .legend-dot.asset{ background:var(--amber); }

  .stats-chart-wrap{
    padding:6px 14px 20px;
    position:relative;
    height:250px;
  }
  .stats-chart-wrap svg{ display:block; width:100%; height:100%; overflow:visible; }
  .chart-value-tag{ font-size:10px; font-weight:600; }
  .chart-axis-label{ font-size:9.5px; }
  .chart-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    line-height:1.6;
    padding:0 20px;
  }

  /* ===== 섹션 공통 ===== */
  .section{padding:10px 20px 4px;}
  .habit-list{display:flex; flex-direction:column;}
  .empty-hint{
    padding:10px 2px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .habit-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 2px;
    border-bottom:1px solid var(--line);
    gap:10px;
    background:var(--paper);
    position:relative;
    transition:background .15s ease;
    touch-action:none;
  }
  .habit-row:last-child{border-bottom:none;}
  .habit-row.dragging{
    background:var(--paper-dim);
    box-shadow:0 4px 10px rgba(0,0,0,.08);
    border-radius:8px;
    z-index:5;
    transition:none;
  }
  .habit-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    flex:1;
    min-width:0;
  }
  .habit-emoji{font-size:15px; flex-shrink:0;}
  .habit-text{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .habit-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .streak{
    font-size:11px;
    color:var(--amber);
    font-weight:600;
    min-width:34px;
    text-align:right;
  }
  .streak.zero{color:var(--ink-soft); font-weight:400;}
  .streak .flame{ filter:grayscale(1); opacity:.45; margin-right:1px; }
  .streak:not(.zero) .flame{ filter:none; opacity:1; }

  .checkbox{
    width:26px; height:26px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:transparent;
    transition:all .12s ease;
    cursor:pointer;
  }
  .checkbox.check{ background:var(--sage-bg); border-color:var(--sage); color:var(--sage); }
  .checkbox.warn{ background:var(--amber-bg); border-color:var(--amber); color:var(--amber); }
  .checkbox.fail{ background:var(--brick-bg); border-color:var(--brick); color:var(--brick); }

  .add-habit-btn{
    margin-top:4px;
    padding:10px 20px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .add-habit-btn:active{ opacity:.55; }
  .add-habit-btn .plus{
    width:18px; height:18px;
    border-radius:6px;
    border:1px dashed var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
  }

  /* ===== 습관 추가 모달 ===== */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(36,34,32,.4);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-card{
    background:var(--paper);
    border-radius:14px;
    padding:18px;
    width:100%;
    max-width:320px;
  }
  .modal-title{ font-size:14px; font-weight:600; margin-bottom:14px; }
  .modal-field{ margin-bottom:12px; }
  .modal-field label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .modal-field input{
    width:100%;
    font-size:13px;
    font-family:inherit;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  .modal-field input:focus{ outline:none; border-color:var(--ink-soft); }
  .segment{ display:flex; gap:6px; }
  .segment-btn{
    flex:1;
    text-align:center;
    font-size:12px;
    padding:8px 0;
    border-radius:8px;
    background:var(--paper-dim);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .segment-btn.active{ background:var(--ink); color:var(--paper); font-weight:600; }
  .modal-actions{ display:flex; gap:8px; margin-top:6px; }
  .modal-btn{
    flex:1;
    text-align:center;
    font-size:13px;
    padding:9px 0;
    border-radius:8px;
    cursor:pointer;
  }
  .modal-btn.cancel{ background:var(--paper-dim); color:var(--ink-soft); }
  .modal-btn.confirm{ background:var(--sage); color:var(--paper); font-weight:600; }

  .divider{height:8px; background:var(--paper-dim);}

  .footnote{
    padding:14px 20px 26px;
    font-size:10.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="device">

  <div class="stats-btn" id="statsBtn">📊</div>

  <!-- 날짜별로 화면 전체가 슬라이드되는 영역 -->
  <div class="page-viewport">
    <div class="page-slide" id="pageSlide">

      <div class="statusbar" id="statusbar">
        <div class="statusbar-row">
          <div class="date-block">
            <div class="date-main" id="dateMain">-</div>
            <div class="date-sub" id="dateSub">-</div>
          </div>
          <div class="stat-block">
            <div class="stat-value" id="statWeight">👙 —</div>
            <div class="stat-value" id="statAsset">💎 —</div>
          </div>
        </div>
        <div class="swipe-hint">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot active"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>

      <!-- 하지 말아야 할 습관 -->
      <div class="section">
        <div class="habit-list" id="avoidList"></div>
      </div>

      <div class="divider"></div>

      <!-- 능동적으로 실천하는 습관 -->
      <div class="section">
        <div class="habit-list" id="activeList"></div>
      </div>

      <div class="add-habit-btn" id="addHabitBtn"><span class="plus">+</span>습관 추가</div>

      <div class="footnote">
        화면을 좌우로 스와이프하면 이전/이후 날짜 전체 화면으로 이동합니다 (그날의 습관도 그대로 체크 가능).<br>
        체크박스를 탭할 때마다 상태가 순환하고, 습관 텍스트를 짧게 탭하면 삭제, 길게 눌러 움직이면 순서가 바뀝니다.
      </div>

    </div>
  </div>

  <!-- 습관 추가 모달 -->
  <div class="modal-backdrop" id="addHabitBackdrop">
    <div class="modal-card">
      <div class="modal-title">습관 추가</div>

      <div class="modal-field">
        <label>분류</label>
        <div class="segment" id="categorySegment">
          <div class="segment-btn active" data-cat="avoid">🚫 하지 않기</div>
          <div class="segment-btn" data-cat="active">✅ 실천하기</div>
        </div>
      </div>

      <div class="modal-field">
        <label>습관 (이모지+이름)</label>
        <input type="text" id="newHabitText" placeholder="예: 📵 야식">
      </div>

      <div class="modal-field">
        <label>시작일</label>
        <input type="date" id="newHabitDate">
      </div>

      <div class="modal-actions">
        <div class="modal-btn cancel" id="cancelAddHabit">취소</div>
        <div class="modal-btn confirm" id="confirmAddHabit">추가</div>
      </div>
    </div>
  </div>

  <!-- 통계 화면: 몸무게·자산 추이 그래프 -->
  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-header">
      <div class="stats-back" id="statsBack">←</div>
      <div class="stats-title">통계</div>
    </div>
    <div class="stats-tabs">
      <div class="stats-tab active" data-range="daily">일간 · 최근 7일</div>
      <div class="stats-tab" data-range="weekly">주간 · 최근 7주</div>
      <div class="stats-tab" data-range="monthly">월간 · 최근 7개월</div>
    </div>
    <div class="stats-legend">
      <span><span class="legend-dot weight"></span>몸무게</span>
      <span><span class="legend-dot asset"></span>자산</span>
    </div>
    <div class="stats-chart-wrap" id="statsChartWrap"></div>
  </div>

</div>

<script>
// ==================================================================
// 날짜 유틸 (offsetFromToday: 0=오늘, 1=어제, 2=이틀 전 ...)
// ==================================================================
const WEEKDAY = ["일","월","화","수","목","금","토"];
function pad2(n){ return String(n).padStart(2, "0"); }
function dateForOffset(offset){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - offset);
  return d;
}
function dateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseDateKey(key){
  const [y,m,day] = key.split("-").map(Number);
  return new Date(y, m-1, day);
}
function dateLabel(d){ return `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAY[d.getDay()]})`; }
function subLabel(offset){
  if(offset === 0) return "오늘";
  if(offset === 1) return "어제";
  return `${offset}일 전`;
}

// ==================================================================
// 데이터 저장 (localStorage) — 이 폰 브라우저에만 저장됨
// 처음 실행 시 예시 습관 없이 완전히 빈 목록에서 시작합니다.
// ==================================================================
const STORAGE_KEY = "habitTrackerV1";

function loadStore(){
  let s = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) s = JSON.parse(raw);
  }catch(e){ console.error("저장된 데이터를 불러오지 못했습니다", e); }
  if(!s) s = {};
  if(!s.days) s.days = {};
  if(!s.streaks) s.streaks = {};
  if(!s.habits) s.habits = { avoid: [], active: [] }; // 백지 상태로 시작
  return s;
}
function saveStore(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch(e){ console.error("저장 실패", e); }
}

const store = loadStore();
const MAX_OFFSET = 90; // 너무 먼 과거로 스와이프되는 것 방지
let offsetFromToday = 0;

// 해당 날짜의 저장된 기록을 가져오거나, 없으면 기본값 반환(저장은 안 함)
function getRecord(key){
  if(store.days[key]) return store.days[key];
  const avoid = {}, active = {};
  store.habits.avoid.forEach(h => avoid[h.id] = "check");   // 하지않기 기본값: 체크
  store.habits.active.forEach(h => active[h.id] = "none");  // 실천하기 기본값: 미체크
  return { weight:null, asset:null, avoid, active };
}
// 실제로 값을 바꿀 때는 이 함수로 레코드를 만들고 저장까지 함
function ensureRecord(key){
  if(!store.days[key]) store.days[key] = getRecord(key);
  return store.days[key];
}

// ---- 체크박스 상태 순환 ----
function cycleAvoid(s){ return s==="check" ? "warn" : s==="warn" ? "fail" : "check"; }
function cycleActive(s){ return s==="none" ? "check" : s==="check" ? "warn" : s==="warn" ? "fail" : "none"; }

// "하지 않기" 습관: 매일 기본값이 체크(=지켰다고 간주)이므로,
// 아무것도 안 눌러도 날짜가 지나면 스트릭이 자동으로 올라가도록 매번 히스토리를 계산한다.
function computeAvoidStreak(habit){
  const start = parseDateKey(habit.createdAt);
  const today = dateForOffset(0);
  if(start > today) return 0;
  let counter = 0;
  const d = new Date(start);
  while(d <= today){
    const key = dateKey(d);
    const rec = store.days[key];
    const state = (rec && rec.avoid && rec.avoid[habit.id]) ? rec.avoid[habit.id] : "check";
    if(state === "check") counter += 1;
    else if(state === "fail") counter = 0;
    // warn: 스트릭 유지(가감 없음)
    d.setDate(d.getDate() + 1);
  }
  return counter;
}

// "실천하기" 습관: 능동적으로 눌러야 하는 것이라 탭할 때만 스트릭이 바뀐다.
function applyActiveStreak(habitId, newState){
  if(newState === "check") store.streaks[habitId] = (store.streaks[habitId]||0) + 1;
  else if(newState === "fail") store.streaks[habitId] = 0;
}

const iconFor = { check:"✓", warn:"△", fail:"✕", none:"" };

// ---- 습관 추가 (모달: 분류 선택 + 시작일 지정) ----
function parseHabitInput(input){
  const trimmed = input.trim();
  const m = trimmed.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*(.*)$/u);
  if(m && m[2]) return { emoji:m[1], text:m[2] };
  return { emoji:"📌", text:trimmed };
}

let selectedCategory = "avoid";

function openAddHabitModal(){
  document.getElementById("newHabitText").value = "";
  document.getElementById("newHabitDate").value = dateKey(dateForOffset(0));
  selectedCategory = "avoid";
  document.querySelectorAll("#categorySegment .segment-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.cat === "avoid");
  });
  document.getElementById("addHabitBackdrop").classList.add("open");
}
function closeAddHabitModal(){
  document.getElementById("addHabitBackdrop").classList.remove("open");
}
function confirmAddHabit(){
  const raw = document.getElementById("newHabitText").value;
  if(!raw || !raw.trim()){ alert("습관 이름을 입력해주세요."); return; }
  const { emoji, text } = parseHabitInput(raw);
  const dateVal = document.getElementById("newHabitDate").value;
  const createdAt = dateVal || dateKey(dateForOffset(0));
  const id = selectedCategory + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const habit = { id, emoji, text, createdAt };
  store.habits[selectedCategory].push(habit);
  if(selectedCategory === "active") store.streaks[id] = 0;
  saveStore();
  renderList(selectedCategory);
  closeAddHabitModal();
}

// ---- 길게 눌러 순서 바꾸기 / 짧게 탭해서 삭제 ----
let dragCtx = null;

function attachRowDrag(row, index, category, habit){
  let pressTimer = null;
  let startX = 0, startY = 0;
  row.addEventListener("pointerdown", e=>{
    if(e.target.closest(".checkbox")) return;
    if(e.pointerType === "mouse" && e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    pressTimer = setTimeout(()=>{
      pressTimer = null;
      beginDrag(category, index, startY);
    }, 420);
  });
  row.addEventListener("pointermove", e=>{
    if(!pressTimer) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8){ // 손떨림 정도는 무시하고, 실제로 움직였을 때만 롱프레스 취소
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  });
  row.addEventListener("pointerup", e=>{
    if(pressTimer){                 // 420ms 안에 손을 뗌 = 드래그 시작 전 짧은 탭 → 삭제
      clearTimeout(pressTimer);
      pressTimer = null;
      if(!e.target.closest(".checkbox")) deleteHabit(category, habit);
    }
  });
  row.addEventListener("pointercancel", ()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  });
}

function deleteHabit(category, habit){
  const ok = confirm(`'${habit.text}' 습관을 삭제할까요?`);
  if(!ok) return;
  const arr = store.habits[category];
  const idx = arr.findIndex(h => h.id === habit.id);
  if(idx !== -1) arr.splice(idx, 1);
  delete store.streaks[habit.id];
  saveStore();
  renderList(category);
}

function listElFor(category){ return document.getElementById(category==="avoid" ? "avoidList" : "activeList"); }

function beginDrag(category, index, startY){
  const rows = Array.from(listElFor(category).children);
  if(!rows.length) return;
  dragCtx = { category, index, startY, rows, rowHeight: rows[0].offsetHeight || 40 };
  rows[index].classList.add("dragging");
  document.addEventListener("pointermove", onDragMove, {passive:false});
  document.addEventListener("pointerup", onDragEnd);
  document.addEventListener("pointercancel", onDragEnd);
}

function onDragMove(e){
  if(!dragCtx) return;
  e.preventDefault();
  const deltaY = e.clientY - dragCtx.startY;
  const draggedRow = dragCtx.rows[dragCtx.index];
  if(draggedRow) draggedRow.style.transform = `translateY(${deltaY}px)`;

  const arr = store.habits[dragCtx.category];
  const shift = Math.round(deltaY / dragCtx.rowHeight);
  const newIndex = Math.max(0, Math.min(arr.length - 1, dragCtx.index + shift));

  if(newIndex !== dragCtx.index){
    const [moved] = arr.splice(dragCtx.index, 1);
    arr.splice(newIndex, 0, moved);
    dragCtx.index = newIndex;
    dragCtx.startY = e.clientY;
    renderList(dragCtx.category);
    dragCtx.rows = Array.from(listElFor(dragCtx.category).children);
    if(dragCtx.rows[dragCtx.index]) dragCtx.rows[dragCtx.index].classList.add("dragging");
  }
}

function onDragEnd(){
  if(!dragCtx) return;
  Array.from(listElFor(dragCtx.category).children).forEach(r=>{
    r.classList.remove("dragging");
    r.style.transform = "";
  });
  saveStore();
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragEnd);
  document.removeEventListener("pointercancel", onDragEnd);
  dragCtx = null;
}

// ---- 렌더링 ----
function renderList(category){
  const containerId = category === "avoid" ? "avoidList" : "activeList";
  const cycleFn = category === "avoid" ? cycleAvoid : cycleActive;
  const key = dateKey(dateForOffset(offsetFromToday));
  const record = getRecord(key);
  const habitDefs = store.habits[category];
  const el = document.getElementById(containerId);
  el.innerHTML = "";

  if(habitDefs.length === 0){
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = category === "avoid"
      ? "아직 등록된 습관이 없어요. 아래 '+ 습관 추가'에서 만들어보세요."
      : "아직 등록된 습관이 없어요. 아래 '+ 습관 추가'에서 만들어보세요.";
    el.appendChild(hint);
    return;
  }

  habitDefs.forEach((h, idx)=>{
    const state = record[category][h.id] !== undefined ? record[category][h.id] : (category==="avoid" ? "check" : "none");
    const streak = category === "avoid" ? computeAvoidStreak(h) : (store.streaks[h.id] || 0);

    const row = document.createElement("div");
    row.className = "habit-row";
    row.innerHTML = `
      <div class="habit-label">
        <span class="habit-emoji">${h.emoji}</span>
        <span class="habit-text">${h.text}</span>
      </div>
      <div class="habit-right">
        <span class="streak ${streak===0?'zero':''}"><span class="flame">🔥</span>${streak>0 ? streak+'일' : '-'}</span>
        <div class="checkbox ${state!=='none'?state:''}">${iconFor[state]}</div>
      </div>
    `;
    row.querySelector(".checkbox").addEventListener("click", ()=>{
      const rec = ensureRecord(key);
      const newState = cycleFn(rec[category][h.id]);
      rec[category][h.id] = newState;
      if(category === "active") applyActiveStreak(h.id, newState);
      saveStore();
      renderList(category);
    });
    attachRowDrag(row, idx, category, h);
    el.appendChild(row);
  });
}

function renderAllLists(){

}

// 자산 표시할 때 천단위 콤마 자동으로 넣기 (예: +12000 -> +12,000)
function formatAssetDisplay(raw){
  if(raw == null) return "";
  const str = String(raw).trim();
  const m = str.match(/^([+-]?)([\d,]*\.?\d*)(.*)$/);
  if(!m || m[2] === "") return str;
  const sign = m[1];
  const numPart = m[2].replace(/,/g, "");
  const suffix = m[3];
  const [intPart, decPart] = numPart.split(".");
  const withCommas = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return sign + withCommas + (decPart !== undefined ? "." + decPart : "") + suffix;
}

// 화면 전체 스와이프 (페이지 넘기듯 이전/다음 날짜로 전환)
// ==================================================================
const pageSlide = document.getElementById("pageSlide");
let swipeStartX = 0, swipeStartY = 0, swipeActive = false, swipeDeciding = false, swipeDir = null;

function transitionDay(deltaOffset){ // +1: 과거로, -1: 최신으로
  const width = pageSlide.getBoundingClientRect().width || 320;
  const exitX = deltaOffset > 0 ? width : -width;
  const enterX = deltaOffset > 0 ? -width : width;

  pageSlide.style.transition = "transform .18s ease";
  pageSlide.style.transform = `translateX(${exitX}px)`;

  const onExitEnd = ()=>{
    pageSlide.removeEventListener("transitionend", onExitEnd);
    offsetFromToday += deltaOffset;
    renderAll();
    pageSlide.style.transition = "none";
    pageSlide.style.transform = `translateX(${enterX}px)`;
    void pageSlide.offsetWidth; // 강제 리플로우
    pageSlide.style.transition = "transform .18s ease";
    pageSlide.style.transform = "translateX(0px)";
  };
  pageSlide.addEventListener("transitionend", onExitEnd, { once:true });
}
function snapBack(){
  pageSlide.style.transition = "transform .18s ease";
  pageSlide.style.transform = "translateX(0px)";
}

pageSlide.addEventListener("pointerdown", e=>{
  if(e.pointerType === "mouse" && e.button !== 0) return;
  swipeStartX = e.clientX;
  swipeStartY = e.clientY;
  swipeActive = true;
  swipeDeciding = true;
  swipeDir = null;
});

pageSlide.addEventListener("pointermove", e=>{
  if(!swipeActive) return;
  const dx = e.clientX - swipeStartX;
  const dy = e.clientY - swipeStartY;

  if(swipeDeciding){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // 방향 아직 판단 중
    swipeDeciding = false;
    swipeDir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  }
  if(swipeDir !== "h") return; // 세로 움직임(습관 순서 변경 등)은 그대로 두고 관여하지 않음

  e.preventDefault();
  pageSlide.style.transition = "none";
  pageSlide.style.transform = `translateX(${dx}px)`;
}, { passive:false });

pageSlide.addEventListener("pointerup", e=>{
  if(!swipeActive) return;
  swipeActive = false;
  if(swipeDir !== "h"){ swipeDir = null; return; }
  const dx = e.clientX - swipeStartX;
  swipeDir = null;

  if(dx > 60 && offsetFromToday < MAX_OFFSET){
    transitionDay(1);   // 오른쪽으로 스와이프 → 이전(과거) 날짜
  } else if(dx < -60 && offsetFromToday > 0){
    transitionDay(-1);  // 왼쪽으로 스와이프 → 다음(최신) 날짜
  } else {
    snapBack();
  }
});
pageSlide.addEventListener("pointercancel", ()=>{
  swipeActive = false;
  swipeDir = null;
  snapBack();
});

// 통계 화면 (외부 라이브러리 없이 순수 SVG, 실제 기록 기반)
// ==================================================================
let currentRange = "daily";

function parseAssetNumber(v){
  if(v == null) return null;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? null : n;
}

function collectDailySeries(){
  const labels=[], weight=[], asset=[];
  for(let i=6;i>=0;i--){
    const d = dateForOffset(i);
    const rec = store.days[dateKey(d)];
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    weight.push(rec && rec.weight != null ? rec.weight : null);
    asset.push(rec && rec.asset != null ? parseAssetNumber(rec.asset) : null);
  }
  return { labels, weight, asset };
}
function collectWeeklySeries(){
  const labels=[], weight=[], asset=[];
  for(let w=6; w>=0; w--){
    let bestRec = null;
    for(let o=w*7; o<=w*7+6; o++){
      const rec = store.days[dateKey(dateForOffset(o))];
      if(rec){ bestRec = rec; break; } // offset 오름차순 = 최신부터 탐색
    }
    labels.push(w===0 ? "이번주" : `${w}주전`);
    weight.push(bestRec && bestRec.weight != null ? bestRec.weight : null);
    asset.push(bestRec && bestRec.asset != null ? parseAssetNumber(bestRec.asset) : null);
  }
  return { labels, weight, asset };
}
function collectMonthlySeries(){
  const labels=[], weight=[], asset=[];
  const today = dateForOffset(0);
  const keys = Object.keys(store.days);
  for(let m=6; m>=0; m--){
    const target = new Date(today.getFullYear(), today.getMonth()-m, 1);
    const ym = `${target.getFullYear()}-${pad2(target.getMonth()+1)}`;
    let bestDay=-1, bestRec=null;
    keys.forEach(key=>{
      if(key.startsWith(ym+"-")){
        const day = parseInt(key.split("-")[2], 10);
        if(day > bestDay){ bestDay = day; bestRec = store.days[key]; }
      }
    });
    labels.push(`${target.getMonth()+1}월`);
    weight.push(bestRec && bestRec.weight != null ? bestRec.weight : null);
    asset.push(bestRec && bestRec.asset != null ? parseAssetNumber(bestRec.asset) : null);
  }
  return { labels, weight, asset };
}

function toSparsePoints(values, w, h, padL, padR, padT, padB){
  const nonNull = values.filter(v=>v!=null);
  if(nonNull.length===0) return null;
  const min = Math.min(...nonNull);
  const max = Math.max(...nonNull);
  const span = (max-min) || 1;
  const innerW = w-padL-padR;
  const innerH = h-padT-padB;
  return values.map((v,i)=>{
    const x = padL + (values.length===1 ? innerW/2 : innerW*i/(values.length-1));
    if(v==null) return null;
    const y = padT + innerH*(1-(v-min)/span);
    return { x, y, v };
  });
}
function pathFromSparsePoints(points){
  let d = "", started = false;
  points.forEach(p=>{
    if(p == null){ started = false; return; }
    d += (started ? "L" : "M") + p.x.toFixed(1) + "," + p.y.toFixed(1) + " ";
    started = true;
  });
  return d.trim();
}
function seriesMarkup(points, color, unit, decimals){
  if(!points) return "";
  const nonNull = points.filter(p=>p);
  if(nonNull.length===0) return "";
  const path = pathFromSparsePoints(points);
  const dots = nonNull.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${color}"/>`).join("");
  const first = nonNull[0], last = nonNull[nonNull.length-1];
  const firstLabel = `<text class="chart-value-tag" x="${first.x}" y="${first.y-8}" text-anchor="start" fill="${color}">${first.v.toFixed(decimals)}${unit}</text>`;
  const lastLabel = (last !== first)
    ? `<text class="chart-value-tag" x="${last.x}" y="${last.y-8}" text-anchor="end" fill="${color}">${last.v.toFixed(decimals)}${unit}</text>`
    : "";
  return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${firstLabel}${lastLabel}`;
}

function renderChart(range){
  const d = range==="daily" ? collectDailySeries() : range==="weekly" ? collectWeeklySeries() : collectMonthlySeries();
  const wrap = document.getElementById("statsChartWrap");
  const hasAnyData = d.weight.some(v=>v!=null) || d.asset.some(v=>v!=null);

  if(!hasAnyData){
    wrap.innerHTML = `<div class="chart-empty">아직 쌓인 기록이 없어요.<br>몸무게·자산을 며칠 기록하면<br>여기에 추이 그래프가 나타나요.</div>`;
    return;
  }

  const w = wrap.clientWidth || 320;
  const h = wrap.clientHeight || 250;
  const padL = 6, padR = 6, padT = 26, padB = 26;

  const weightPts = toSparsePoints(d.weight, w, h, padL, padR, padT, padB);
  const assetPts  = toSparsePoints(d.asset,  w, h, padL, padR, padT, padB);

  const rootStyle = getComputedStyle(document.documentElement);
  const sage  = rootStyle.getPropertyValue("--sage").trim();
  const amber = rootStyle.getPropertyValue("--amber").trim();
  const line  = rootStyle.getPropertyValue("--line").trim();
  const inkSoft = rootStyle.getPropertyValue("--ink-soft").trim();

  const gridY = [padT, h - padB];
  const gridLines = gridY.map(y=>`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="${line}" stroke-width="1"/>`).join("");

  const xLabels = d.labels.map((lab, i)=>{
    const innerW = w-padL-padR;
    const x = padL + (d.labels.length===1 ? innerW/2 : innerW*i/(d.labels.length-1));
    return `<text class="chart-axis-label" x="${x}" y="${h-6}" text-anchor="middle" fill="${inkSoft}">${lab}</text>`;
  }).join("");

  const svg = `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      ${gridLines}
      ${seriesMarkup(weightPts, sage, "kg", 1)}
      ${seriesMarkup(assetPts, amber, "", 0)}
      ${xLabels}
    </svg>
  `;
  wrap.innerHTML = svg;
}
