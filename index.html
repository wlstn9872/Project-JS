<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>습관 트래커</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF9F5">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#FAF9F5;
    --paper-dim:#F1EFE8;
    --ink:#242220;
    --ink-soft:#8A8579;
    --line:#E4E0D6;
    --sage:#6E7F5C;
    --sage-bg:#E7ECDE;
    --amber:#C1893F;
    --amber-bg:#F3E7D3;
    --brick:#AD5138;
    --brick-bg:#F2DFD8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    background:var(--paper-dim);
    font-family:-apple-system, "Roboto", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color:var(--ink);
  }
  .device{
    max-width:420px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  /* ===== 상태표시줄 (날짜 / 몸무게·자산 / 통계버튼) ===== */
  .statusbar{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    touch-action:pan-y;
    user-select:none;
  }
  .statusbar-top{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .statusbar-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex:1;
    min-width:0;
    transition:transform .18s ease, opacity .18s ease;
  }
  .date-block{display:flex; flex-direction:column; gap:2px;}
  .date-main{font-size:15px; font-weight:600; letter-spacing:-.2px;}
  .date-sub{font-size:11px; color:var(--ink-soft);}
  .stat-block{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .stat-value{
    font-size:15px;
    font-weight:600;
    padding:1px 4px;
    margin:-1px -4px;
    border-radius:5px;
    cursor:pointer;
  }
  .stat-value:active{background:var(--paper-dim);}
  .swipe-hint{
    display:flex; justify-content:center; gap:4px; margin-top:10px;
  }
  .dot{width:4px; height:4px; border-radius:50%; background:var(--line);}
  .dot.active{background:var(--ink-soft);}

  .stats-btn{
    width:28px; height:28px;
    flex-shrink:0;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    cursor:pointer;
  }
  .stats-btn:active{background:var(--paper-dim);}

  /* ===== 통계 오버레이 ===== */
  .stats-overlay{
    position:absolute;
    inset:0;
    background:var(--paper);
    transform:translateX(100%);
    transition:transform .22s ease;
    z-index:10;
    display:flex;
    flex-direction:column;
  }
  .stats-overlay.open{ transform:translateX(0); }
  .stats-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .stats-back{
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    cursor:pointer;
    border-radius:8px;
  }
  .stats-back:active{background:var(--paper-dim);}
  .stats-title{font-size:14px; font-weight:600;}

  .stats-tabs{
    display:flex;
    gap:6px;
    padding:12px 16px 0;
  }
  .stats-tab{
    flex:1;
    text-align:center;
    font-size:12px;
    padding:7px 0;
    border-radius:8px;
    background:var(--paper-dim);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .stats-tab.active{
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
  }

  .stats-legend{
    display:flex;
    gap:16px;
    padding:14px 16px 0;
    font-size:11px;
    color:var(--ink-soft);
  }
  .legend-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    margin-right:5px;
  }
  .legend-dot.weight{ background:var(--sage); }
  .legend-dot.asset{ background:var(--amber); }

  .stats-chart-wrap{
    padding:6px 14px 20px;
    position:relative;
    height:250px;
  }
  .stats-chart-wrap svg{ display:block; width:100%; height:100%; overflow:visible; }
  .chart-value-tag{ font-size:10px; font-weight:600; }
  .chart-axis-label{ font-size:9.5px; }

  /* ===== 섹션 공통 ===== */
  .section{padding:10px 20px 4px;}
  .habit-list{display:flex; flex-direction:column;}
  .habit-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 2px;
    border-bottom:1px solid var(--line);
    gap:10px;
    background:var(--paper);
    position:relative;
    transition:background .15s ease;
  }
  .habit-row:last-child{border-bottom:none;}
  .habit-row.dragging{
    background:var(--paper-dim);
    box-shadow:0 4px 10px rgba(0,0,0,.08);
    border-radius:8px;
    z-index:5;
    transition:none;
  }
  .habit-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    flex:1;
    min-width:0;
  }
  .habit-emoji{font-size:15px; flex-shrink:0;}
  .habit-text{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .habit-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .streak{
    font-size:11px;
    color:var(--amber);
    font-weight:600;
    min-width:34px;
    text-align:right;
  }
  .streak.zero{color:var(--ink-soft); font-weight:400;}
  .streak .flame{ filter:grayscale(1); opacity:.45; margin-right:1px; }
  .streak:not(.zero) .flame{ filter:none; opacity:1; }

  .checkbox{
    width:26px; height:26px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:transparent;
    transition:all .12s ease;
    cursor:pointer;
  }
  .checkbox.check{ background:var(--sage-bg); border-color:var(--sage); color:var(--sage); }
  .checkbox.warn{ background:var(--amber-bg); border-color:var(--amber); color:var(--amber); }
  .checkbox.fail{ background:var(--brick-bg); border-color:var(--brick); color:var(--brick); }

  .add-habit-btn{
    margin-top:4px;
    padding:10px 20px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .add-habit-btn:active{ opacity:.55; }
  .add-habit-btn .plus{
    width:18px; height:18px;
    border-radius:6px;
    border:1px dashed var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
  }

  /* ===== 습관 추가 모달 ===== */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(36,34,32,.4);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-card{
    background:var(--paper);
    border-radius:14px;
    padding:18px;
    width:100%;
    max-width:320px;
  }
  .modal-title{ font-size:14px; font-weight:600; margin-bottom:14px; }
  .modal-field{ margin-bottom:12px; }
  .modal-field label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .modal-field input{
    width:100%;
    font-size:13px;
    font-family:inherit;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  .modal-field input:focus{ outline:none; border-color:var(--ink-soft); }
  .segment{ display:flex; gap:6px; }
  .segment-btn{
    flex:1;
    text-align:center;
    font-size:12px;
    padding:8px 0;
    border-radius:8px;
    background:var(--paper-dim);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .segment-btn.active{ background:var(--ink); color:var(--paper); font-weight:600; }
  .modal-actions{ display:flex; gap:8px; margin-top:6px; }
  .modal-btn{
    flex:1;
    text-align:center;
    font-size:13px;
    padding:9px 0;
    border-radius:8px;
    cursor:pointer;
  }
  .modal-btn.cancel{ background:var(--paper-dim); color:var(--ink-soft); }
  .modal-btn.confirm{ background:var(--sage); color:var(--paper); font-weight:600; }

  .divider{height:8px; background:var(--paper-dim);}

  .footnote{
    padding:14px 20px 26px;
    font-size:10.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="device">

  <!-- 상태표시줄: 날짜 / 몸무게·자산 / 통계 버튼, 좌우 스와이프로 날짜 이동 -->
  <div class="statusbar" id="statusbar">
    <div class="statusbar-top">
      <div class="statusbar-row" id="statusbarRow">
        <div class="date-block">
          <div class="date-main" id="dateMain">-</div>
          <div class="date-sub" id="dateSub">-</div>
        </div>
        <div class="stat-block">
          <div class="stat-value" id="statWeight">👙 —</div>
          <div class="stat-value" id="statAsset">💎 —</div>
        </div>
      </div>
      <div class="stats-btn" id="statsBtn">📊</div>
    </div>
    <div class="swipe-hint">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <!-- 하지 말아야 할 습관 (기본 체크, 탭하면 세모 → 엑스 → 다시 체크) -->
  <div class="section">
    <div class="habit-list" id="avoidList"></div>
  </div>

  <div class="divider"></div>

  <!-- 능동적으로 실천하는 습관 (기본 미체크, 탭하면 체크 → 세모 → 엑스) -->
  <div class="section">
    <div class="habit-list" id="activeList"></div>
  </div>

  <div class="add-habit-btn" id="addHabitBtn"><span class="plus">+</span>습관 추가</div>

  <div class="footnote">
    상태표시줄을 좌우로 스와이프하면 이전/이후 날짜 기록으로 이동합니다.<br>
    체크박스를 탭할 때마다 상태가 순환하고, 습관 텍스트를 짧게 탭하면 삭제, 길게 눌러 움직이면 순서가 바뀝니다.
  </div>

  <!-- 습관 추가 모달 -->
  <div class="modal-backdrop" id="addHabitBackdrop">
    <div class="modal-card">
      <div class="modal-title">습관 추가</div>

      <div class="modal-field">
        <label>분류</label>
        <div class="segment" id="categorySegment">
          <div class="segment-btn active" data-cat="avoid">🚫 하지 않기</div>
          <div class="segment-btn" data-cat="active">✅ 실천하기</div>
        </div>
      </div>

      <div class="modal-field">
        <label>습관 (이모지+이름)</label>
        <input type="text" id="newHabitText" placeholder="예: 📵 야식">
      </div>

      <div class="modal-field">
        <label>시작일</label>
        <input type="date" id="newHabitDate">
      </div>

      <div class="modal-actions">
        <div class="modal-btn cancel" id="cancelAddHabit">취소</div>
        <div class="modal-btn confirm" id="confirmAddHabit">추가</div>
      </div>
    </div>
  </div>

  <!-- 통계 화면: 몸무게·자산 추이 그래프 -->
  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-header">
      <div class="stats-back" id="statsBack">←</div>
      <div class="stats-title">통계</div>
    </div>
    <div class="stats-tabs">
      <div class="stats-tab active" data-range="daily">일간 · 최근 7일</div>
      <div class="stats-tab" data-range="weekly">주간 · 최근 7주</div>
      <div class="stats-tab" data-range="monthly">월간 · 최근 7개월</div>
    </div>
    <div class="stats-legend">
      <span><span class="legend-dot weight"></span>몸무게</span>
      <span><span class="legend-dot asset"></span>자산</span>
    </div>
    <div class="stats-chart-wrap" id="statsChartWrap"></div>
  </div>

</div>

<script>
// ==================================================================
// 날짜 유틸 (offsetFromToday: 0=오늘, 1=어제, 2=이틀 전 ...)
// ==================================================================
const WEEKDAY = ["일","월","화","수","목","금","토"];
function pad2(n){ return String(n).padStart(2, "0"); }
function dateForOffset(offset){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - offset);
  return d;
}
function dateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseDateKey(key){
  const [y,m,day] = key.split("-").map(Number);
  return new Date(y, m-1, day);
}
function dateLabel(d){ return `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAY[d.getDay()]})`; }
function subLabel(offset){
  if(offset === 0) return "오늘";
  if(offset === 1) return "어제";
  return `${offset}일 전`;
}

// ==================================================================
// 데이터 저장 (localStorage) — 이 폰 브라우저에만 저장됨
// ==================================================================
const STORAGE_KEY = "habitTrackerV1";

const DEFAULT_HABITS = {
  avoid: [
    { id:"avoid_shorts", emoji:"📱", text:"쇼츠·SNS 스크롤" },
    { id:"avoid_snack",  emoji:"🌙", text:"야식" },
    { id:"avoid_excuse", emoji:"😤", text:"핑계로 훈련 건너뛰기" },
  ],
  active: [
    { id:"active_run",  emoji:"🏃",  text:"새벽 러닝 3km" },
    { id:"active_read", emoji:"📖",  text:"독서 노트" },
    { id:"active_jp",   emoji:"🇯🇵", text:"일본어 학습 1시간" },
    { id:"active_yoga", emoji:"🧘",  text:"인요가 30분" },
    { id:"active_blog", emoji:"✍️", text:"블로그 포스팅" },
  ]
};

function loadStore(){
  let s = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) s = JSON.parse(raw);
  }catch(e){ console.error("저장된 데이터를 불러오지 못했습니다", e); }
  if(!s) s = {};
  if(!s.days) s.days = {};
  if(!s.streaks) s.streaks = {};
  if(!s.habits){
    const today = dateKey(dateForOffset(0));
    s.habits = {
      avoid:  DEFAULT_HABITS.avoid.map(h => ({ ...h, createdAt: today })),
      active: DEFAULT_HABITS.active.map(h => ({ ...h, createdAt: today })),
    };
  }
  s.habits.active.forEach(h=>{ if(s.streaks[h.id] === undefined) s.streaks[h.id] = 0; });
  return s;
}
function saveStore(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch(e){ console.error("저장 실패", e); }
}

const store = loadStore();
const MAX_OFFSET = 90; // 너무 먼 과거로 스와이프되는 것 방지
let offsetFromToday = 0;

// 해당 날짜의 저장된 기록을 가져오거나, 없으면 기본값 반환(저장은 안 함)
function getRecord(key){
  if(store.days[key]) return store.days[key];
  const avoid = {}, active = {};
  store.habits.avoid.forEach(h => avoid[h.id] = "check");   // 하지않기 기본값: 체크
  store.habits.active.forEach(h => active[h.id] = "none");  // 실천하기 기본값: 미체크
  return { weight:null, asset:null, avoid, active };
}
// 실제로 값을 바꿀 때는 이 함수로 레코드를 만들고 저장까지 함
function ensureRecord(key){
  if(!store.days[key]) store.days[key] = getRecord(key);
  return store.days[key];
}

// ---- 체크박스 상태 순환 ----
function cycleAvoid(s){ return s==="check" ? "warn" : s==="warn" ? "fail" : "check"; }
function cycleActive(s){ return s==="none" ? "check" : s==="check" ? "warn" : s==="warn" ? "fail" : "none"; }

// "하지 않기" 습관: 매일 기본값이 체크(=지켰다고 간주)이므로,
// 아무것도 안 눌러도 날짜가 지나면 스트릭이 자동으로 올라가도록 매번 히스토리를 계산한다.
function computeAvoidStreak(habit){
  const start = parseDateKey(habit.createdAt);
  const today = dateForOffset(0);
  if(start > today) return 0;
  let counter = 0;
  const d = new Date(start);
  while(d <= today){
    const key = dateKey(d);
    const rec = store.days[key];
    const state = (rec && rec.avoid && rec.avoid[habit.id]) ? rec.avoid[habit.id] : "check";
    if(state === "check") counter += 1;
    else if(state === "fail") counter = 0;
    // warn: 스트릭 유지(가감 없음)
    d.setDate(d.getDate() + 1);
  }
  return counter;
}

// "실천하기" 습관: 능동적으로 눌러야 하는 것이라 탭할 때만 스트릭이 바뀐다.
function applyActiveStreak(habitId, newState){
  if(newState === "check") store.streaks[habitId] = (store.streaks[habitId]||0) + 1;
  else if(newState === "fail") store.streaks[habitId] = 0;
}

const iconFor = { check:"✓", warn:"△", fail:"✕", none:"" };

// ---- 습관 추가 (모달: 분류 선택 + 시작일 지정) ----
function parseHabitInput(input){
  const trimmed = input.trim();
  const m = trimmed.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*(.*)$/u);
  if(m && m[2]) return { emoji:m[1], text:m[2] };
  return { emoji:"📌", text:trimmed };
}

let selectedCategory = "avoid";

function openAddHabitModal(){
  document.getElementById("newHabitText").value = "";
  document.getElementById("newHabitDate").value = dateKey(dateForOffset(0));
  selectedCategory = "avoid";
  document.querySelectorAll("#categorySegment .segment-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.cat === "avoid");
  });
  document.getElementById("addHabitBackdrop").classList.add("open");
}
function closeAddHabitModal(){
  document.getElementById("addHabitBackdrop").classList.remove("open");
}
function confirmAddHabit(){
  const raw = document.getElementById("newHabitText").value;
  if(!raw || !raw.trim()){ alert("습관 이름을 입력해주세요."); return; }
  const { emoji, text } = parseHabitInput(raw);
  const dateVal = document.getElementById("newHabitDate").value;
  const createdAt = dateVal || dateKey(dateForOffset(0));
  const id = selectedCategory + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const habit = { id, emoji, text, createdAt };
  store.habits[selectedCategory].push(habit);
  if(selectedCategory === "active") store.streaks[id] = 0;
  saveStore();
  renderList(selectedCategory);
  closeAddHabitModal();
}

// ---- 길게 눌러 순서 바꾸기 (드래그 리오더) ----
let dragCtx = null;

function attachRowDrag(row, index, category, habit){
  let pressTimer = null;
  row.addEventListener("pointerdown", e=>{
    if(e.target.closest(".checkbox")) return;
    if(e.pointerType === "mouse" && e.button !== 0) return;
    const startY = e.clientY;
    pressTimer = setTimeout(()=>{
      pressTimer = null;
      beginDrag(category, index, startY);
    }, 420);
  });
  row.addEventListener("pointermove", ()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  });
  row.addEventListener("pointerup", e=>{
    if(pressTimer){                 // 420ms 안에 손을 뗌 = 드래그 시작 전 짧은 탭 → 삭제
      clearTimeout(pressTimer);
      pressTimer = null;
      if(!e.target.closest(".checkbox")) deleteHabit(category, habit);
    }
  });
  row.addEventListener("pointercancel", ()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  });
}

function deleteHabit(category, habit){
  const ok = confirm(`'${habit.text}' 습관을 삭제할까요?`);
  if(!ok) return;
  const arr = store.habits[category];
  const idx = arr.findIndex(h => h.id === habit.id);
  if(idx !== -1) arr.splice(idx, 1);
  delete store.streaks[habit.id];
  saveStore();
  renderList(category);
}

function listElFor(category){ return document.getElementById(category==="avoid" ? "avoidList" : "activeList"); }

function beginDrag(category, index, startY){
  const rows = Array.from(listElFor(category).children);
  if(!rows.length) return;
  dragCtx = { category, index, startY, rows, rowHeight: rows[0].offsetHeight || 40 };
  rows[index].classList.add("dragging");
  document.addEventListener("pointermove", onDragMove, {passive:false});
  document.addEventListener("pointerup", onDragEnd);
  document.addEventListener("pointercancel", onDragEnd);
}

function onDragMove(e){
  if(!dragCtx) return;
  e.preventDefault();
  const deltaY = e.clientY - dragCtx.startY;
  const draggedRow = dragCtx.rows[dragCtx.index];
  if(draggedRow) draggedRow.style.transform = `translateY(${deltaY}px)`;

  const arr = store.habits[dragCtx.category];
  const shift = Math.round(deltaY / dragCtx.rowHeight);
  const newIndex = Math.max(0, Math.min(arr.length - 1, dragCtx.index + shift));

  if(newIndex !== dragCtx.index){
    const [moved] = arr.splice(dragCtx.index, 1);
    arr.splice(newIndex, 0, moved);
    dragCtx.index = newIndex;
    dragCtx.startY = e.clientY;
    renderList(dragCtx.category);
    dragCtx.rows = Array.from(listElFor(dragCtx.category).children);
    if(dragCtx.rows[dragCtx.index]) dragCtx.rows[dragCtx.index].classList.add("dragging");
  }
}

function onDragEnd(){
  if(!dragCtx) return;
  Array.from(listElFor(dragCtx.category).children).forEach(r=>{
    r.classList.remove("dragging");
    r.style.transform = "";
  });
  saveStore();
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragEnd);
  document.removeEventListener("pointercancel", onDragEnd);
  dragCtx = null;
}

// ---- 렌더링 ----
function renderList(category){
  const containerId = category === "avoid" ? "avoidList" : "activeList";
  const cycleFn = category === "avoid" ? cycleAvoid : cycleActive;
  const key = dateKey(dateForOffset(offsetFromToday));
  const record = getRecord(key);
  const habitDefs = store.habits[category];
  const el = document.getElementById(containerId);
  el.innerHTML = "";

  habitDefs.forEach((h, idx)=>{
    const state = record[category][h.id] !== undefined ? record[category][h.id] : (category==="avoid" ? "check" : "none");
    const streak = category === "avoid" ? computeAvoidStreak(h) : (store.streaks[h.id] || 0);

    const row = document.createElement("div");
    row.className = "habit-row";
    row.innerHTML = `
      <div class="habit-label">
        <span class="habit-emoji">${h.emoji}</span>
        <span class="habit-text">${h.text}</span>
      </div>
      <div class="habit-right">
        <span class="streak ${streak===0?'zero':''}"><span class="flame">🔥</span>${streak>0 ? streak+'일' : '-'}</span>
        <div class="checkbox ${state!=='none'?state:''}">${iconFor[state]}</div>
      </div>
    `;
    row.querySelector(".checkbox").addEventListener("click", ()=>{
      const rec = ensureRecord(key);
      const newState = cycleFn(rec[category][h.id]);
      rec[category][h.id] = newState;
      if(category === "active") applyActiveStreak(h.id, newState);
      saveStore();
      renderList(category);
    });
    attachRowDrag(row, idx, category, h);
    el.appendChild(row);
  });
}

function renderAllLists(){
  renderList("avoid");
  renderList("active");
}

// ---- 스와이프 제스처 (좌우로 날짜 이동, 마우스 드래그도 지원) ----
const bar = document.getElementById("statusbar");
const row = document.getElementById("statusbarRow");
let startX = 0, startY = 0, dragging = false;

bar.addEventListener("pointerdown", e=>{
  if(e.pointerType === "mouse" && e.button !== 0) return;
  startX = e.clientX;
  startY = e.clientY;
  dragging = true;
});

bar.addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if(Math.abs(dx) > Math.abs(dy)){
    row.style.transform = `translateX(${dx*0.4}px)`;
    row.style.opacity = 1 - Math.min(Math.abs(dx)/300, 0.5);
  }
});

bar.addEventListener("pointerup", e=>{
  if(!dragging) return;
  dragging = false;
  const dx = e.clientX - startX;
  row.style.transform = "";
  row.style.opacity = "";
  if(dx > 60 && offsetFromToday < MAX_OFFSET){       // 오른쪽으로 스와이프 → 이전(과거) 날짜
    offsetFromToday += 1;
    renderAll();
  } else if(dx < -60 && offsetFromToday > 0){        // 왼쪽으로 스와이프 → 다음(최신) 날짜
    offsetFromToday -= 1;
    renderAll();
  }
});
bar.addEventListener("pointercancel", ()=>{
  dragging = false;
  row.style.transform = "";
  row.style.opacity = "";
});

// ---- 통계 화면 (외부 라이브러리 없이 순수 SVG로 직접 그림) --------

// 예시 추이 데이터 (디자인 목업용 임의 값 — 실제 기록 연동은 추후 단계)
const statsData = {
  daily: {
    labels:["8/30","8/31","9/1","9/2","9/3","9/4","9/5"],
    weight:[65.4,65.2,65.1,65.0,65.1,64.8,64.6],
    asset:[210,222,218,231,239,244,256]
  },
  weekly: {
    labels:["7주전","6주전","5주전","4주전","3주전","2주전","1주전"],
    weight:[67.8,67.1,66.6,66.2,65.7,65.3,64.9],
    asset:[150,168,180,197,215,233,251]
  },
  monthly: {
    labels:["3월","4월","5월","6월","7월","8월","9월"],
    weight:[71.5,70.2,69.0,67.8,66.9,65.6,64.6],
    asset:[60,95,120,150,190,225,256]
  }
};

let currentRange = "daily";

function toPoints(values, w, h, padL, padR, padT, padB){
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = (max - min) || 1;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  return values.map((v, i)=>{
    const x = padL + (values.length === 1 ? innerW/2 : innerW * i/(values.length-1));
    const y = padT + innerH * (1 - (v - min)/span);
    return { x, y, v };
  });
}
function pointsToPath(points){
  return points.map((p,i)=> (i===0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
}

function renderChart(range){
  const d = statsData[range];
  const wrap = document.getElementById("statsChartWrap");
  const w = wrap.clientWidth || 320;
  const h = wrap.clientHeight || 250;
  const padL = 6, padR = 6, padT = 26, padB = 26;

  const weightPts = toPoints(d.weight, w, h, padL, padR, padT, padB);
  const assetPts  = toPoints(d.asset,  w, h, padL, padR, padT, padB);

  const rootStyle = getComputedStyle(document.documentElement);
  const sage  = rootStyle.getPropertyValue("--sage").trim();
  const amber = rootStyle.getPropertyValue("--amber").trim();
  const line  = rootStyle.getPropertyValue("--line").trim();
  const inkSoft = rootStyle.getPropertyValue("--ink-soft").trim();

  const gridY = [padT, h - padB];
  const gridLines = gridY.map(y=>`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="${line}" stroke-width="1"/>`).join("");

  const xLabels = d.labels.map((lab, i)=>{
    const x = weightPts[i].x;
    return `<text class="chart-axis-label" x="${x}" y="${h-6}" text-anchor="middle" fill="${inkSoft}">${lab}</text>`;
  }).join("");

  function seriesMarkup(points, color, unit, decimals){
    const path = pointsToPath(points);
    const dots = points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${color}"/>`).join("");
    const first = points[0], last = points[points.length-1];
    const firstLabel = `<text class="chart-value-tag" x="${first.x}" y="${first.y-8}" text-anchor="start" fill="${color}">${first.v.toFixed(decimals)}${unit}</text>`;
    const lastLabel  = `<text class="chart-value-tag" x="${last.x}" y="${last.y-8}" text-anchor="end" fill="${color}">${last.v.toFixed(decimals)}${unit}</text>`;
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${firstLabel}${lastLabel}`;
  }

  const svg = `
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      ${gridLines}
      ${seriesMarkup(weightPts, sage, "kg", 1)}
      ${seriesMarkup(assetPts, amber, "", 0)}
      ${xLabels}
    </svg>
  `;
  wrap.innerHTML = svg;
}

    currentRange = tab.dataset.range;
